<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <title>DC Furniture - Product Details</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #ffffff;
        color: #222;
    }

    /* HEADER */
    .header {
        background: #111;
        color: white;
        text-align: center;
        padding: 25px 10px;
    }

    .header h1 {
        font-size: 45px;
        letter-spacing: 2px;
    }

    .header p {
        margin: 8px 0;
        font-size: 18px;
        color: #d4af37;
        font-weight: bold;
    }

    /* PRODUCT PAGE */
    .product-page {
        max-width: 1200px;
        margin: 40px auto;
        padding: 20px;
    }

    .product-container {
        display: grid;
        grid-template-columns: 55% 45%;
        gap: 50px;
        align-items: center;
    }

    /* PRODUCT IMAGE */
    .product-image-box {
        background: #f8f8f8;
        border-radius: 10px;
        height: 600px;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .product-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    /* PRODUCT INFORMATION */
    .new-collection {
        color: #999;
        font-size: 14px;
        letter-spacing: 1px;
        margin-bottom: 18px;
    }

    .product-title {
        font-size: 42px;
        font-weight: 500;
        margin-bottom: 5px;
    }

    .product-color {
        color: #999;
        font-size: 28px;
        margin-bottom: 25px;
    }

    /* PRICE */
    .price-quantity {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
    }

    .price-label {
        color: #999;
        font-size: 14px;
        margin-bottom: 8px;
    }

    .price {
        font-size: 34px;
        color: #e74c3c;
        font-weight: 500;
    }

    /* DETAILS */
    .info-section {
        margin-top: 25px;
    }

    .tabs {
        display: flex;
        gap: 50px;
        border-bottom: 1px solid #ddd;
        margin-bottom: 25px;
    }

    .tab {
        padding-bottom: 15px;
        color: #999;
        font-size: 15px;
    }

    .tab.active {
        color: #222;
        border-bottom: 2px solid #222;
    }

    .details {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 15px;
        font-size: 14px;
    }

    .details .label {
        color: red;
        font-size: 20px;
        font-weight: bold;
    }

    .details .value {
        color: black;
        font-size: 20px;
    }

    /* TOTAL */
    .bottom-section {
        margin-top: 45px;
    }

    .total-label {
        color: #999;
        font-size: 14px;
        margin-bottom: 8px;
    }

    .total-price {
        font-size: 32px;
        font-weight: bold;
    }

    /* FOOTER */
    .footer {
        text-align: center;
        padding: 25px;
        color: purple;
        font-size: 20px;
        line-height: 1.6;
    }

    /* =========================
       MOBILE RESPONSIVE
    ========================= */

    @media (max-width: 768px) {

        .header {
            padding: 20px 10px;
        }

        .header h1 {
            font-size: 28px;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 15px;
        }

        .product-page {
            margin: 10px auto;
            padding: 15px;
        }

        .product-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: stretch;
        }

        .product-image-box {
            width: 100%;
            height: 350px;
            border-radius: 10px;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .product-info {
            width: 100%;
        }

        .new-collection {
            font-size: 12px;
            margin-bottom: 10px;
        }

        .product-title {
            font-size: 30px;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .product-color {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .price-quantity {
            margin-bottom: 20px;
        }

        .price {
            font-size: 28px;
        }

        .tabs {
            gap: 20px;
            margin-bottom: 20px;
        }

        .tab {
            font-size: 14px;
            padding-bottom: 10px;
        }

        .details {
            grid-template-columns: 90px 1fr;
            gap: 12px;
        }

        .details .label {
            font-size: 16px;
        }

        .details .value {
            font-size: 16px;
            line-height: 1.4;
        }

        .bottom-section {
            margin-top: 30px;
        }

        .total-price {
            font-size: 28px;
        }

        .footer {
            font-size: 16px;
            padding: 20px 10px;
        }
    }

    /* SMALL MOBILE */
    @media (max-width: 400px) {

        .header h1 {
            font-size: 24px;
        }

        .product-image-box {
            height: 280px;
        }

        .product-title {
            font-size: 26px;
        }

        .product-color {
            font-size: 18px;
        }

        .price {
            font-size: 25px;
        }

        .details {
            grid-template-columns: 80px 1fr;
        }

        .details .label,
        .details .value {
            font-size: 14px;
        }

        .total-price {
            font-size: 25px;
        }
    }
</style>

</head> <body>
<!-- HEADER -->
<div class="header">
    <h1>WELCOME</h1>
    <p>TO</p>
    <h1>DC FURNITURE</h1>
</div>

<!-- PRODUCT PAGE -->
<div class="product-page">

    <div class="product-container">

        <!-- PRODUCT IMAGE -->
        <div class="product-image-box">
            <img
                src="WhatsApp Image 2026-10-05 at 3.48.27 PM.jpeg"
                alt="Diamond Double Bed"
                class="product-image"
            >
        </div>

        <!-- PRODUCT INFORMATION -->
        <div class="product-info">

            <div class="new-collection">
                NEW COLLECTION
            </div>

            <h1 class="product-title">
                Diamond Double Bed
            </h1>

            <div class="product-color">
                Wooden Finish
            </div>

            <!-- PRICE -->
            <div class="price-quantity">

                <div>
                    <div class="price-label">
                        PRICE
                    </div>

                    <div class="price">
                        ₹26,000
                    </div>
                </div>

            </div>

            <!-- DETAILS -->
            <div class="info-section">

                <div class="tabs">
                    <div class="tab active">
                        DETAILS
                    </div>
                </div>

                <div class="details">

                    <div class="label">
                        Size
                    </div>

                    <div class="value">
                        6 × 6.5 Feet
                    </div>

                    <div class="label">
                        Material
                    </div>

                    <div class="value">
                        Premium Wooden / Plywood
                    </div>

                    <div class="label">
                        Color
                    </div>

                    <div class="value">
                        Wallnut Polish
                    </div>

                    <div class="label">
                        Model
                    </div>

                    <div class="value">
                        DD-001
                    </div>

                </div>

            </div>

            <!-- TOTAL -->
            <div class="bottom-section">

                <div class="total-label">
                    TOTAL PRICE
                </div>

                <div class="total-price" id="totalPrice">
                    ₹26,000
                </div>

            </div>

        </div>

    </div>

</div>

<!-- FOOTER -->
<div class="footer">
    <strong>DC Furniture</strong><br>
    JESINGPARA, DHARI ROAD, AMRELI
</div>
</body>
</html>
