<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DC Furniture - Product Details</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #ffffff;
            color: #222;
        }

        .product-page {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        .product-container {
            display: grid;
            grid-template-columns: 55% 45%;
            gap: 50px;
            align-items: center;
        }
		
		  /* Header */
        .header {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px 10px;
        }

        .header h1 {
            font-size: 45px;
            letter-spacing: 2px;
        }

        .header p {
            margin-top: 8px;
            font-size: 18px;
            color: #d4af37;
            font-weight: bold;
        }
		
		

        /* LEFT SIDE */
        .product-image-box {
            background: #f8f8f8;
            border-radius: 10px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .product-image {
            width: 125%;
            height: 125%;
            object-fit: contain;
        }

        /* RIGHT SIDE */
        .new-collection {
            color: #999;
            font-size: 14px;
            letter-spacing: 1px;
            margin-bottom: 18px;
        }

        .product-title {
            font-size: 42px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .product-color {
            color: #999;
            font-size: 28px;
            margin-bottom: 25px;
        }


        /* PRICE + QUANTITY */
        .price-quantity {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .price-label,
        .quantity-label {
            color: #999;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .price {
            font-size: 34px;
            color: #e74c3c;
            font-weight: 500;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 25px;
            overflow: hidden;
        }

        .quantity-box button {
            border: none;
            background: white;
            width: 45px;
            height: 42px;
            font-size: 20px;
            cursor: pointer;
        }

        .quantity-box span {
            width: 40px;
            text-align: center;
            font-size: 17px;
        }

        /* DESCRIPTION */
        .info-section {
            margin-top: 25px;
        }

        .tabs {
            display: flex;
            gap: 50px;
            border-bottom: 1px solid #ddd;
            margin-bottom: 25px;
        }

        .tab {
            padding-bottom: 15px;
            color: #999;
            font-size: 15px;
        }

        .tab.active {
            color: #222;
            border-bottom: 2px solid #222;
        }

        .details {
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: 12px;
            font-size: 14px;
        }

        .details .label {
            color: red;
			 font-size: 25px;
        }

        .details .value {
            color: black;
			 font-size: 25px;
        }

        /* BOTTOM */
        .bottom-section {
            margin-top: 45px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .total-label {
            color: #999;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .total-price {
            font-size: 32px;
        }

        .add-cart {
            border: none;
            background: #f05a3c;
            color: white;
            font-size: 17px;
            padding: 17px 45px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        .add-cart:hover {
            background: #d94327;
            transform: translateY(-2px);
        }
		  /* Footer */
        .footer {
            text-align: center;
            padding: 25px;
            color: purple;
            font-size: 20px;
        }

       

            
        
    </style>
</head>

<body>'

  <!-- HEADER -->
    <div class="header">
        <h1>WELCOME</h1>
        <p>TO</p>
        <h1>DC FURNITURE</h1>
    </div>

<div class="product-page">

    <div class="product-container">

        <!-- PRODUCT IMAGE -->
        <div class="product-image-box">
            <img src="WhatsApp Image 2026-10-05 at 3.48.27 PM.jpeg"
                 alt="Furniture Product"
                 class="product-image">
        </div>


        <!-- PRODUCT INFORMATION -->
        <div class="product-info">

            <div class="new-collection">
                NEW COLLECTION
            </div>

            <h1 class="product-title">
                Diamond Double Bed
            </h1>

            <div class="product-color">
                Wooden Finish
            </div>


            <!-- PRICE + QUANTITY -->
            <div class="price-quantity">

                <div>
                    <div class="price-label">
                        PRICE
                    </div>

                    <div class="price">
                        ₹26,000
                    </div>
                </div>


                <div>

                   

                    </div>
                </div>

            </div>


            <!-- DETAILS -->
            <div class="info-section">

                <div class="tabs">

                    <div class="tab active">
                        DETAILS
                    </div>

                </div>


                <div class="details">

                    <div class="label">
                        Size
                    </div>

                    <div class="value">
                        6 × 6.5 Feet
                    </div>


                    <div class="label">
                        Material
                    </div>

                    <div class="value">
                        Premium Wooden / Plywood
                    </div>


                    <div class="label">
                        Color
                    </div>

                    <div class="value">
                        wallnet polish 
                    </div>

                    <div class="label">
                        Model
                    </div>

                    <div class="value">
                        DD-001
                    </div>

                </div>

            </div>


            <!-- TOTAL + CART -->
            <div class="bottom-section">

                <div>

                    <div class="total-label">
                        TOTAL PRICE
                    </div>

                    <div class="total-price"
                         id="totalPrice">
                        ₹26,000
                    </div>
					

                </div>

            </div>

        </div>

    </div>

</div>


<script>

    let quantity = 1;
    const unitPrice = 26000;


    function increaseQuantity() {

        quantity++;

        document.getElementById("quantity").innerText = quantity;

        updateTotal();

    }


    function decreaseQuantity() {

        if (quantity > 1) {

            quantity--;

        }

        document.getElementById("quantity").innerText = quantity;

        updateTotal();

    }


    function updateTotal() {

        let total = quantity * unitPrice;

        document.getElementById("totalPrice").innerText =
            "₹" + total.toLocaleString("en-IN");

    }


    function addToCart() {

        alert(
            "Product added to cart!\nQuantity: " + quantity
        );

    }

</script>
    <!-- FOOTER -->
    <div class="footer">
         DC Furniture<br>
        JESINGPARA, DHARIROAD, AMRELI
    </div>

</body>
</html>
